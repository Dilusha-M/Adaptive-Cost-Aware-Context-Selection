[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-context-retrieval"
version = "0.1.0"
description = "Adaptive Budget-Aware Context Retrieval Using Repository Graphs for LLM-Based Coding Agents"
requires-python = ">=3.12"
dependencies = [
    "networkx",
    "typer",
    "rich",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "tiktoken",
]

[project.scripts]
adaptive-context = "cli.main:main"
evaluate = "cli.evaluation:evaluate"

[tool.setuptools.packages.find]
include = ["parser*", "graph*", "retrieval*", "metrics*", "cli*"]
